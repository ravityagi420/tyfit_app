<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TYFIT | Check-in Submitted</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tyfit check-in success summary">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/premium-ui.css?v=20260523f" rel="stylesheet">
    <link href="css/checkin.css?v=20260525f" rel="stylesheet">
</head>
<body class="tyfit-app" data-page="checkin-success">
    <div class="checkin-success-page">
        <!-- Purple Success Header with Floating Icon -->
        <div class="success-hero">
            <!-- Floating Success Icon -->
            <div class="success-floating-icon">
                <img src="assets/status/checkin_success_illustration.svg" alt="Check-in success" class="success-icon-illustration">
            </div>
        </div>

        <!-- White Content Panel -->
        <div class="success-content">
            <!-- Title Section -->
            <h1 class="success-title">Check-in Submitted!</h1>
            <p class="success-subtitle">Great job staying consistent 💪</p>

            <!-- Today's Summary Card -->
            <div class="today-summary-card">
                <h3 class="summary-card-title">Today's Progress</h3>
                <!-- Left: Progress Ring -->
                <div class="summary-ring-section">
                    <svg class="summary-ring" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#8B7CFF;stop-opacity:1" />
                                <stop offset="55%" style="stop-color:#6C63FF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5146E8;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="60" cy="60" r="54" fill="none" stroke="#EEEAFE" stroke-width="12"/>
                        <circle class="summary-ring-progress" cx="60" cy="60" r="54" fill="none" stroke="url(#ringGradient)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 339.29" transform="rotate(-90 60 60)"/>
                        <text x="60" y="56" text-anchor="middle" class="summary-ring-value" id="successScoreValue">0%</text>
                        <text x="60" y="76" text-anchor="middle" class="summary-ring-label">Overall Score</text>
                    </svg>
                </div>

                <!-- Middle: Divider -->
                <div class="summary-divider"></div>

                <!-- Right: Counts -->
                <div class="summary-counts-section">
                    <div class="summary-count">
                        <div class="count-icon done"><i data-lucide="check"></i></div>
                        <span class="count-number"><strong id="successDone">0</strong> Done</span>
                    </div>
                    <div class="summary-count">
                        <div class="count-icon partial"><i data-lucide="plus"></i></div>
                        <span class="count-number"><strong id="successPartial">0</strong> Partial</span>
                    </div>
                    <div class="summary-count">
                        <div class="count-icon missed"><i data-lucide="x"></i></div>
                        <span class="count-number"><strong id="successMissed">0</strong> Missed</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="success-buttons">
                <a href="checkin_summary.html" class="success-btn primary" id="viewHistoryBtn">
                    <i data-lucide="history"></i> View History
                </a>
                <a href="index.html" class="success-btn secondary">
                    <i data-lucide="home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/lucide/lucide.min.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/login.js?v=20260523l"></script>
    <script src="js/checkin_success.js?v=20260525c"></script>
</body>
</html>
