<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TYFIT | Coach Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tyfit coach public profile">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/premium-ui.css?v=20260608-checkin-save" rel="stylesheet">
    <link href="css/tyfit-design-system.css?v=20260608-standard-ui" rel="stylesheet">
    <link href="css/coach.css?v=20260714-coach-contact-overlay" rel="stylesheet">
    <link href="css/coach-public-overrides.css?v=20260719-bmr-form-refinement" rel="stylesheet">
</head>
<body class="tyfit-app" data-page="coach-public-profile">
    <header class="tyfit-mobile-topbar coach-app-mobile-topbar">
        <button class="tyfit-icon-btn" id="mobileMenuBtn" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <a class="tyfit-logo-link tyfit-mobile-logo-center" href="index.html" aria-label="TYFIT home"><img src="assets/tyfit_img/black_icon_logo.png" alt="TYFIT" class="tyfit-logo-img"><span class="tyfit-wordmark">TYFIT</span></a>
        <button class="tyfit-icon-btn" type="button" id="coachShareBtn" aria-label="Share coach profile"><i data-lucide="share"></i></button>
    </header>

    <aside class="tyfit-mobile-drawer sidebar" id="mobileDrawer" aria-hidden="true">
        <div class="sidebar-inner">
            <div class="tyfit-mobile-drawer-head">
                <button class="tyfit-icon-btn" id="mobileDrawerClose" aria-label="Close menu"><i data-lucide="x"></i></button>
                <a class="tyfit-logo-link" href="index.html" aria-label="TYFIT home"><img src="assets/tyfit_img/black_icon_logo.png" alt="TYFIT" class="tyfit-logo-img"><span class="tyfit-wordmark">TYFIT</span></a>
            </div>
            <div class="sidebar-menu"></div>
        </div>
    </aside>
    <div class="tyfit-mobile-drawer-backdrop" id="mobileDrawerBackdrop" hidden></div>

    <div class="tyfit-layout" id="tyfitLayout">
        <aside class="tyfit-sidebar sidebar" id="tyfitSidebar">
            <div class="sidebar-inner">
                <div class="tyfit-sidebar-head"><a class="tyfit-logo-link sidebar-logo" href="index.html" aria-label="TYFIT home"><img src="assets/tyfit_img/black_icon_logo.png" alt="TYFIT" class="tyfit-logo-img"><span class="tyfit-wordmark">TYFIT</span></a></div>
                <div class="sidebar-menu"></div>
            </div>
        </aside>
        <button class="tyfit-sidebar-toggle-floating" id="sidebarCollapseBtn" aria-label="Toggle sidebar"><i data-lucide="panel-left-close"></i></button>

        <main class="tyfit-main coach-public-page">
            <div class="tyfit-desktop-actions">
                <button class="tyfit-icon-btn tyfit-notif-btn" type="button" id="coachShareDesktopBtn" aria-label="Share coach profile"><i data-lucide="share"></i></button>
                <span class="tyfit-desktop-separator" aria-hidden="true"></span>
                <div class="tyfit-dropdown-wrap" id="desktopAccountWrap"><button class="tyfit-account-btn" id="desktopAccountBtn" aria-label="Account menu"><img id="desktopProfileAvatar" class="tyfit-account-avatar" src="assets/avatars/avatar-1.svg" alt="Profile"><span id="desktopProfileName">Account</span><i data-lucide="chevron-down"></i></button><div class="tyfit-popover-menu tyfit-popover-menu--account" id="desktopAccountMenu" aria-hidden="true"><button type="button" class="tyfit-menu-action" data-action="account">My Account</button><button type="button" class="tyfit-menu-action" data-action="logout">Logout</button></div></div>
            </div>
            <div class="coach-shell">
                <div id="coachPublicRoot">
                    <section class="coach-card"><div class="coach-empty">Loading coach profile...</div></section>
                </div>
            </div>
        </main>
    </div>

    <div data-tyfit-bottom-nav></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/lucide/lucide.min.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/profile-utils.js?v=20260423d"></script>
    <script src="js/shell.js?v=20260714-coach-contact-overlay"></script>
    <script src="js/coach.js?v=20260719-bmr-form-refinement"></script>
</body>
</html>
