<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>TYFIT | My Profile</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Complete and edit your TYFIT profile" name="description">

        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">

        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

        <link href="css/style.css?v=20260423g" rel="stylesheet">
    </head>

    <body>
        <div id="navbar-placeholder"></div>

        <main class="tyfit-profile-main" id="profileMain" style="display:none;">
            <section class="tyfit-profile-shell">
                <form id="profileEditForm" class="tyfit-profile-form" novalidate>

                    <!-- Profile Photo Row (Instagram-style) -->
                    <section class="tyfit-profile-card tyfit-photo-card">
                        <div class="tyfit-ig-photo-row">
                            <div class="tyfit-ig-avatar-wrap">
                                <img id="profilePreviewImage" class="tyfit-ig-avatar-img" src="" alt="Profile photo">
                                <button type="button" id="profileEditPhotoBtn" class="tyfit-ig-edit-photo-btn" aria-label="Edit profile photo">
                                    <i class="fa fa-camera"></i>
                                </button>
                            </div>
                            <div class="tyfit-ig-photo-meta">
                                <span class="tyfit-ig-photo-name" id="profileDisplayName">Your Name</span>
                                <button type="button" id="profileChangePhotoTrigger" class="tyfit-ig-change-photo-link">Edit Picture or Avatar</button>
                            </div>
                        </div>

                        <!-- Photo picker modal panel (hidden by default) -->
                        <div id="profilePhotoPicker" class="tyfit-photo-picker" aria-hidden="true">
                            <div id="profilePhotoSwitch" class="tyfit-photo-picker-tabs tyfit-segmented-switch is-upload" role="tablist">
                                <button type="button" class="tyfit-tab-btn active" id="profileTabUpload" role="tab" aria-selected="true" aria-controls="profileUploadPane">
                                    <i class="fa fa-upload"></i> Upload Photo
                                </button>
                                <button type="button" class="tyfit-tab-btn" id="profileTabAvatar" role="tab" aria-selected="false" aria-controls="profileAvatarPane">
                                    <i class="fa fa-user-circle"></i> Choose Avatar
                                </button>
                            </div>
                            <div id="profileUploadPane" class="tyfit-tab-pane is-active" role="tabpanel">
                                <label for="profilePictureInput" class="tyfit-upload-area">
                                    <i class="fa fa-cloud-upload-alt"></i>
                                    <span>Click to upload photo</span>
                                    <small>JPG, PNG or WEBP · Max 5 MB</small>
                                </label>
                                <input type="file" id="profilePictureInput" accept="image/*" hidden>
                            </div>
                            <div id="profileAvatarPane" class="tyfit-tab-pane" role="tabpanel">
                                <div id="profileAvatarGrid" class="tyfit-avatar-grid"></div>
                            </div>
                        </div>
                    </section>

                    <!-- Personal Information -->
                    <section class="tyfit-profile-card">
                        <div class="tyfit-profile-card-head">
                            <h2>Personal Information</h2>
                        </div>
                        <div class="tyfit-field-grid">
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileFirstName">First Name</label>
                                <input type="text" id="profileFirstName" class="tyfit-field-input" placeholder="First name" autocomplete="given-name" required>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileLastName">Last Name</label>
                                <input type="text" id="profileLastName" class="tyfit-field-input" placeholder="Last name" autocomplete="family-name" required>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileDob">Date of Birth</label>
                                <div class="tyfit-input-icon-wrap">
                                    <input type="text" id="profileDob" class="tyfit-field-input tyfit-field-input--with-right-icon" placeholder="DD/MM/YYYY" inputmode="numeric" maxlength="10" autocomplete="bday" required>
                                    <i class="fa fa-calendar-alt tyfit-input-icon tyfit-input-icon--right"></i>
                                </div>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileGender">Gender</label>
                                <div class="tyfit-select-wrap">
                                    <select id="profileGender" class="tyfit-field-input tyfit-field-select" required>
                                        <option value="">Select gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                    <i class="fa fa-chevron-down tyfit-select-arrow"></i>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Contact Information -->
                    <section class="tyfit-profile-card">
                        <div class="tyfit-profile-card-head">
                            <h2>Contact Information</h2>
                        </div>
                        <div class="tyfit-field-grid">
                            <div class="tyfit-field-group tyfit-field-group--full">
                                <label class="tyfit-field-label" for="profileEmail">Email</label>
                                <div class="tyfit-input-icon-wrap">
                                    <input type="email" id="profileEmail" class="tyfit-field-input tyfit-field-input--with-right-icon" readonly>
                                    <i class="fa fa-check-circle tyfit-input-icon tyfit-input-icon--right tyfit-input-icon--verified"></i>
                                </div>
                            </div>
                            <div class="tyfit-field-group tyfit-field-group--full">
                                <label class="tyfit-field-label" for="profilePhoneNumber">Phone Number</label>
                                <div class="tyfit-phone-wrap">
                                    <div class="tyfit-country-code-btn" id="profileCountryCodeBtn" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="tyfit-cc-flag" id="profileCCFlag">🌐</span>
                                        <span class="tyfit-cc-dial" id="profileCCDial">+91</span>
                                        <i class="fa fa-chevron-down tyfit-cc-arrow"></i>
                                        <input type="hidden" id="profilePhoneCode" value="+91">
                                    </div>
                                    <input type="tel" id="profilePhoneNumber" class="tyfit-field-input tyfit-phone-input" placeholder="Phone number" autocomplete="tel-national">
                                    <div id="profileCountryCodeDropdown" class="tyfit-cc-dropdown" role="listbox" aria-label="Country code selector">
                                        <div class="tyfit-cc-search-wrap">
                                            <i class="fa fa-search tyfit-cc-search-icon"></i>
                                            <input type="text" id="profileCCSearch" class="tyfit-cc-search" placeholder="Search country..." autocomplete="off">
                                        </div>
                                        <ul id="profileCCList" class="tyfit-cc-list"></ul>
                                    </div>
                                </div>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileCountry">Country</label>
                                <div class="tyfit-select-wrap">
                                    <select id="profileCountry" class="tyfit-field-input tyfit-field-select" required>
                                        <option value="">Select country</option>
                                    </select>
                                    <i class="fa fa-chevron-down tyfit-select-arrow"></i>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Fitness Details -->
                    <section class="tyfit-profile-card">
                        <div class="tyfit-profile-card-head tyfit-card-head-row">
                            <h2>Fitness Details</h2>
                            <div id="unitSystemSwitch" class="tyfit-unit-toggle tyfit-segmented-switch is-metric" role="group" aria-label="Unit system">
                                <button type="button" id="unitMetricBtn" class="tyfit-unit-btn active">Metric</button>
                                <button type="button" id="unitImperialBtn" class="tyfit-unit-btn">Imperial</button>
                            </div>
                        </div>
                        <div class="tyfit-field-grid">
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileHeight">Height</label>
                                <div class="tyfit-measurement-wrap">
                                    <!-- Metric: cm -->
                                    <input type="number" id="profileHeight" class="tyfit-field-input tyfit-meas-input" min="0" step="0.1" placeholder="170" required>
                                    <!-- Imperial: ft + in -->
                                    <input type="number" id="profileHeightFt" class="tyfit-field-input tyfit-meas-input" min="0" max="9" step="1" placeholder="5" style="display:none;">
                                    <input type="number" id="profileHeightIn" class="tyfit-field-input tyfit-meas-input tyfit-meas-input--in" min="0" max="11" step="1" placeholder="7" style="display:none;">
                                    <span class="tyfit-meas-unit" id="heightUnitLabel">cm</span>
                                    <span class="tyfit-meas-unit" id="heightUnitLabelImperial" style="display:none;">ft / in</span>
                                </div>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileWeight">Weight</label>
                                <div class="tyfit-measurement-wrap">
                                    <input type="number" id="profileWeight" class="tyfit-field-input tyfit-meas-input" min="0" step="0.1" placeholder="70" required>
                                    <span class="tyfit-meas-unit" id="weightUnitLabel">kg</span>
                                </div>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileGoal">Goal</label>
                                <div class="tyfit-select-wrap">
                                    <select id="profileGoal" class="tyfit-field-input tyfit-field-select" required>
                                        <option value="">Select goal</option>
                                        <option value="Fat Loss">Fat Loss</option>
                                        <option value="Muscle Gain">Muscle Gain</option>
                                        <option value="Recomposition">Recomposition</option>
                                        <option value="Maintenance">Maintenance</option>
                                    </select>
                                    <i class="fa fa-chevron-down tyfit-select-arrow"></i>
                                </div>
                            </div>
                            <div class="tyfit-field-group">
                                <label class="tyfit-field-label" for="profileActivityLevel">Activity Level</label>
                                <div class="tyfit-select-wrap">
                                    <select id="profileActivityLevel" class="tyfit-field-input tyfit-field-select" required>
                                        <option value="">Select activity</option>
                                        <option value="Sedentary">Sedentary (Little or No exercise)</option>
                                        <option value="Light Exercise">Light Exercise (1-2 days/week)</option>
                                        <option value="Moderate Exercise">Moderate Exercise (3-5 days/week)</option>
                                        <option value="Heavy Exercise">Heavy Exercise (6-7 days/week)</option>
                                        <option value="Athlete">Athlete (2x per day)</option>
                                    </select>
                                    <i class="fa fa-chevron-down tyfit-select-arrow"></i>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="tyfit-profile-actions">
                        <a href="index.html" class="tyfit-profile-back-btn">Cancel</a>
                        <button type="submit" id="profileSaveBtn" class="tyfit-profile-save-btn">
                            <i class="fa fa-check mr-1"></i> Save Changes
                        </button>
                    </div>
                    <div id="profileSaveStatus" class="tyfit-profile-status" style="display:none;"></div>
                </form>
            </section>
        </main>

        <div id="profileSkeleton" class="tyfit-profile-skeleton">
            <div class="tyfit-profile-skel-head"></div>
            <div class="tyfit-profile-skel-card"></div>
            <div class="tyfit-profile-skel-card"></div>
        </div>

        <a href="#" class="back-to-top"><i class="fa fa-chevron-up"></i></a>

        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-client.js"></script>
        <script src="js/login.js?v=20260423a"></script>
        <script src="js/profile-utils.js?v=20260423c"></script>

        <script src="js/components-loader.js?v=20260423a"></script>
        <script src="js/profile_edit.js?v=20260423h"></script>
    </body>
</html>
