<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>TYFIT | Home</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="TYFIT Personalized Fitness Coaching" name="description">

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">

        <!-- Google Font -->
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <!-- CSS Libraries -->
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

        <!-- Template Stylesheet -->
        <link href="css/style.css?v=20260423e" rel="stylesheet">
    </head>

    <body>
        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Home Page Main -->
        <main class="tyfit-home-main" id="homeMain" style="display:none;">

            <!-- Hero Section -->
            <section class="tyfit-home-hero">
                <div class="tyfit-home-hero-blob"></div>
                <div class="tyfit-home-hero-inner">
                    <div class="tyfit-home-avatar-ring">
                        <img id="homeAvatar" src="" alt="Profile" class="tyfit-home-avatar">
                    </div>
                    <h2 id="homeFullName" class="tyfit-home-name">--</h2>
                    <a href="#" id="homeSeeProfileLink" class="tyfit-see-profile-link">See profile <i class="fa fa-arrow-right"></i></a>
                </div>
            </section>

            <!-- Stats + CTA -->
            <section class="tyfit-home-stats-section">
                <div class="tyfit-home-stats-row">
                    <div class="tyfit-home-stat-card">
                        <div class="tyfit-stat-label">Age</div>
                        <div class="tyfit-stat-value" id="homeAge">--</div>
                        <div class="tyfit-stat-unit">yrs</div>
                    </div>
                    <div class="tyfit-home-stat-card">
                        <div class="tyfit-stat-label">Current Weight</div>
                        <div class="tyfit-stat-value" id="homeWeight">--</div>
                        <div class="tyfit-stat-unit">kg</div>
                    </div>
                </div>
                <div id="homeProfileCompletionCard" class="tyfit-profile-completion-card" style="display:none;">
                    <div class="tyfit-profile-completion-head" id="homeCompletionHead">
                        <span class="tyfit-profile-completion-title" id="homeCompletionTitle">Profile 0% completed</span>
                        <span class="tyfit-profile-completion-pill" id="homeCompletionPill">0%</span>
                    </div>
                    <p class="tyfit-profile-completion-copy" id="homeCompletionCopy"></p>
                    <a href="profile_edit.html" id="homeViewProfileBtn" class="tyfit-home-cta-btn tyfit-home-profile-btn">Complete Profile <i class="fa fa-arrow-right"></i></a>
                </div>
            </section>

            <!-- Tools Section -->
            <section class="tyfit-home-tools-section">
                <div class="tyfit-home-tools-header">Tools</div>
                <div class="tyfit-home-tools-grid" id="homeToolsGrid"></div>
            </section>

        </main>

        <!-- Skeleton loader shown while data loads -->
        <div id="homeSkeleton" class="tyfit-home-skeleton">
            <div class="tyfit-skeleton-hero"></div>
            <div class="tyfit-skeleton-stats"></div>
            <div class="tyfit-skeleton-tools"></div>
        </div>

        <a href="#" class="back-to-top"><i class="fa fa-chevron-up"></i></a>

        <!-- JavaScript Libraries -->
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-client.js"></script>
        <script src="js/login.js?v=20260423a"></script>
        <script src="js/profile-utils.js?v=20260423d"></script>

        <!-- Components Loader -->
        <script src="js/components-loader.js?v=20260423a"></script>

        <!-- Home Page Logic -->
        <script src="js/home.js?v=20260423b"></script>
    </body>
</html>
