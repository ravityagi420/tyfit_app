<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>TYFIT | Admin Dashboard</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Admin Dashboard for TYFIT" name="description">

        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
        <link href="../lib/animate/animate.min.css" rel="stylesheet">
        <link href="../lib/flaticon/font/flaticon.css" rel="stylesheet">
        <link href="../lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
        <link href="../lib/lightbox/css/lightbox.min.css" rel="stylesheet">
        <link href="../css/style.css?v=20260422b" rel="stylesheet">
        <link href="../css/admin.css?v=20260422b" rel="stylesheet">
    </head>

    <body>
        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <div class="admin-dashboard" style="padding: 120px 0 80px;">
            <div class="container">
                <div class="section-header text-center mb-5">
                    <p>Admin Panel</p>
                    <h2>Admin Dashboard</h2>
                    <p class="text-muted">Manage client profiles and coaching details</p>
                </div>
                <div class="row">
                    <!-- Left Panel: User List -->
                    <div class="col-lg-4 col-md-12 mb-4">
                        <div class="bg-white rounded shadow p-4 wow zoomIn" data-wow-delay="0.1s">
                            <h5 class="mb-3">User List</h5>
                            <input type="text" id="userSearch" class="form-control mb-3" placeholder="Search by email">
                            <div id="userList" class="list-group" style="max-height: 400px; overflow-y: auto;">
                                <!-- Users will be populated here -->
                            </div>
                            <div id="emptyState" class="text-center text-muted mt-3" style="display: none;">No users found</div>
                        </div>
                    </div>
                    <!-- Right Panel: Detail Form -->
                    <div class="col-lg-8 col-md-12">
                        <div class="bg-white rounded shadow p-4 wow zoomIn" data-wow-delay="0.2s">
                            <h5 class="mb-3">Profile Details</h5>
                            <div id="formPlaceholder" class="text-center text-muted">
                                Select a user to view details
                            </div>
                            <form id="profileForm" style="display: none;">
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="full_name">Full Name</label>
                                        <input type="text" class="form-control" id="full_name">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="date_of_birth">Date of Birth</label>
                                        <input type="date" class="form-control" id="date_of_birth">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="gender">Gender</label>
                                        <select class="form-control" id="gender">
                                            <option value="">Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="weight">Weight</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="weight">
                                            <div class="input-group-append">
                                                <span class="input-group-text">kg</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="height">Height</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="height">
                                            <div class="input-group-append">
                                                <span class="input-group-text">cm</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="bmr">BMR</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="bmr" readonly>
                                            <div class="input-group-append">
                                                <span class="input-group-text">kCal</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="tdee">TDEE</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="tdee" readonly>
                                            <div class="input-group-append">
                                                <span class="input-group-text">kCal</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="goal">Fitness Goal</label>
                                        <select class="form-control" id="goal">
                                            <option value="Fat Loss">Fat Loss</option>
                                            <option value="Muscle Gain">Muscle Gain</option>
                                            <option value="Overall Health">Overall Health</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="activity_level">Activity Level</label>
                                        <select class="form-control" id="activity_level">
                                            <option value="Sedentary">Sedentary: little or no exercise</option>
                                            <option value="Light">Light: exercise 1-3 times/week</option>
                                            <option value="Moderate">Moderate: exercise 4-5 times/week</option>
                                            <option value="Active">Active: daily exercise or intense exercise 3-4 times/week</option>
                                            <option value="Very Active">Very Active: intense exercise 6-7 times/week</option>
                                            <option value="Extra Active">Extra Active: very intense exercise daily, or physical job</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="start_date">Start Date</label>
                                        <input type="date" class="form-control" id="start_date">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="end_date">End Date</label>
                                        <input type="date" class="form-control" id="end_date">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <button type="button" id="saveProfileBtn" class="btn btn-primary mr-2">Save Changes</button>
                                    <button type="button" id="resetProfileBtn" class="btn btn-secondary">Reset</button>
                                </div>
                                <div id="statusMessage" class="mt-3" style="display: none;"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <a href="#" class="back-to-top"><i class="fa fa-chevron-up"></i></a>

        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
        <script src="../lib/easing/easing.min.js"></script>
        <script src="../lib/wow/wow.min.js"></script>
        <script src="../lib/owlcarousel/owl.carousel.min.js"></script>
        <script src="../lib/isotope/isotope.pkgd.min.js"></script>
        <script src="../lib/lightbox/js/lightbox.min.js"></script>
        <script src="../mail/jqBootstrapValidation.min.js"></script>
        <script src="../mail/contact.js"></script>
        <script src="../js/main.js?v=20260422b"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-client.js"></script>
        <script src="../js/login.js?v=20260422b"></script>

        <!-- Components Loader -->
        <script src="../js/components-loader.js?v=20260422b"></script>

        <!-- Admin Scripts -->
        <script src="../js/admin.js?v=20260419d"></script>
    </body>
</html>
